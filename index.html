<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>iOS Video Player</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --accent:#0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f2; --muted:#999; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, sans-serif; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input { flex:1; min-width:0; padding:12px; font-size:16px; border:1px solid var(--muted); border-radius:10px; background:transparent; color:inherit; }
  button { padding:12px 16px; font-size:16px; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  video { width:100%; max-height:70vh; background:#000; border-radius:12px; }
  #msg { color:var(--muted); font-size:14px; margin-top:8px; word-break:break-all; }
</style>
</head>
<body>
<h1>Video (iPhone / iPad)</h1>
<form id="f">
  <input id="src" type="url" inputmode="url" placeholder=".mp4 və ya .m3u8 linkini yapışdırın" autocomplete="off">
  <button>Aç</button>
</form>
<video id="v" controls playsinline webkit-playsinline preload="metadata"></video>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const video = document.getElementById('v');
const input = document.getElementById('src');
const msg = document.getElementById('msg');
let hls;

function play(url) {
  if (!url) return;
  if (hls) { hls.destroy(); hls = null; }
  msg.textContent = url;
  const isHls = /\.m3u8(\?|$)/i.test(url);
  // Safari on iOS plays HLS natively; other browsers need hls.js.
  if (isHls && !video.canPlayType('application/vnd.apple.mpegurl') && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) msg.textContent = 'Xəta: ' + d.details; });
  } else {
    video.src = url;
  }
  video.play().catch(() => {});
  history.replaceState(null, '', '?src=' + encodeURIComponent(url));
}

video.addEventListener('error', () => {
  msg.textContent = 'Video açılmadı. Link birbaşa video faylı (.mp4/.m3u8) olmalıdır, səhifə linki yox.';
});

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  play(input.value.trim());
});

const initial = new URLSearchParams(location.search).get('src');
if (initial) { input.value = initial; play(initial); }
</script>
</body>
</html>
